<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Murat Koçak Lojistik – İletişim</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Source+Sans+3:wght@400;600&display=swap');

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    background: linear-gradient(145deg, #0d2260 0%, #1a3a8c 50%, #1e4db0 100%);
    font-family: 'Source Sans 3', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  /* LOGO AREA */
  .logo-area {
    text-align: center;
    margin-bottom: 32px;
    animation: fadeDown .5s ease both;
  }
  .logo-box {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    background: rgba(255,255,255,.08);
    border: 1.5px solid rgba(255,255,255,.2);
    border-radius: 16px;
    padding: 16px 24px;
    backdrop-filter: blur(8px);
  }
  .logo-mk-text {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 42px;
    color: #fff;
    line-height: 1;
    border: 2.5px solid rgba(255,255,255,.6);
    padding: 3px 10px;
    letter-spacing: -1px;
  }
  .logo-name {
    text-align: left;
  }
  .logo-name .top {
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: #fff;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .logo-name .wave {
    display: block;
    margin: 3px 0 2px;
  }
  .logo-name .bottom {
    font-size: 10px;
    color: rgba(255,255,255,.65);
    letter-spacing: 3.5px;
    text-transform: uppercase;
  }

  /* CARD */
  .card {
    background: #fff;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,.3);
    width: 100%;
    max-width: 400px;
    overflow: hidden;
    animation: fadeUp .5s .1s ease both;
  }

  .card-header {
    background: linear-gradient(135deg, #1a3a8c, #2a5ac8);
    padding: 20px 24px 18px;
    text-align: center;
  }
  .card-header h2 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  .card-header p {
    font-size: 12.5px;
    color: rgba(255,255,255,.75);
    margin-top: 4px;
  }

  .actions {
    padding: 16px 20px 20px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* ACTION BUTTON */
  .action-btn {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 14px 16px;
    border-radius: 12px;
    text-decoration: none;
    color: #111;
    border: 1.5px solid #e8edf8;
    background: #f8f9fd;
    transition: transform .15s, box-shadow .15s, background .15s;
    cursor: pointer;
  }
  .action-btn:hover, .action-btn:active {
    background: #eef2fc;
    box-shadow: 0 4px 16px rgba(26,58,140,.12);
    transform: translateY(-1px);
  }
  .action-btn:active { transform: scale(.98); }

  .icon-wrap {
    width: 46px;
    height: 46px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .icon-call   { background: #e8f0ff; }
  .icon-wa     { background: #e6f9ee; }
  .icon-map    { background: #fdecea; }
  .icon-mail   { background: #fff3e0; }

  .action-text .title {
    font-weight: 600;
    font-size: 15px;
    color: #111;
    display: block;
  }
  .action-text .sub {
    font-size: 12px;
    color: #888;
    display: block;
    margin-top: 1px;
  }

  .arrow {
    margin-left: auto;
    color: #c0cce8;
  }

  /* FOOTER */
  .footer {
    margin-top: 20px;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,.45);
    animation: fadeUp .5s .25s ease both;
  }

  @keyframes fadeDown {
    from { opacity:0; transform: translateY(-18px); }
    to   { opacity:1; transform: translateY(0); }
  }
  @keyframes fadeUp {
    from { opacity:0; transform: translateY(18px); }
    to   { opacity:1; transform: translateY(0); }
  }
</style>
</head>
<body>

<!-- LOGO -->
<div class="logo-area">

    <div class="logo-mk-text">MK</div>
    <div class="logo-name">

        <path d="M2 8 Q16 4 28 8 Q40 12 52 8 Q64 4 76 8 Q88 12 100 8 Q106 6 110 7"
              stroke="rgba(255,255,255,0.25)" stroke-width="1" fill="none" stroke-linecap="round"/>

  </div>
</div>
